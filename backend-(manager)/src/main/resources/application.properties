spring.application.name=fearless-gpus
spring.application.name=fearless-gpus

# Local dev matches Vite proxy (ui-(interactor)/vite.config.js). Docker sets SERVER_PORT=8080.
server.port=${SERVER_PORT:8080}

# Local developer values are supplied through environment variables; production has no defaults.
spring.datasource.url=jdbc:postgresql://localhost:5433/fearless_gpus
spring.datasource.username=fearless_user
spring.datasource.password=REPLACE_WITH_A_LONG_RANDOM_POSTGRES_PASSWORD
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MinIO
# docker-compose maps host 9002 -> container 9000 (fearless-gpus-minio). Use 127.0.0.1 to avoid IPv6 localhost surprises.
minio.url=${MINIO_URL:http://127.0.0.1:9002}
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=${MINIO_BUCKET_NAME:datasets}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
# docker-compose maps host 5673 -> container 5672
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5673}
spring.rabbitmq.username=radmin
spring.rabbitmq.password=radmin

# JWT
jwt.secret=fsfdsdfgfjlgdf
jwt.expiration=${JWT_EXPIRATION:86400000}

# Required for worker-only dataset/job callbacks. Set this in every deployment.
worker.internal-token=WORKER_INTERNAL_TOKEN_TRY_THIS

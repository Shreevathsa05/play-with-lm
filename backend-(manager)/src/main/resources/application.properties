spring.application.name=fearless-gpus

# Local dev matches Vite proxy (ui-(interactor)/vite.config.js). Docker sets SERVER_PORT=8080.
server.port=${SERVER_PORT:18080}

# Local developer values are supplied through environment variables; production has no defaults.
spring.datasource.url=jdbc:postgresql://localhost:5433/fearless_gpus
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket-name=${MINIO_BUCKET_NAME:datasets}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Required for worker-only dataset/job callbacks. Set this in every deployment.
worker.internal-token=${WORKER_INTERNAL_TOKEN:}

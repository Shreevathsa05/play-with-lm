version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fearless-gpus-db
    environment:
      POSTGRES_USER: fearless_user
      POSTGRES_PASSWORD: fearless_password
      POSTGRES_DB: fearless_gpus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: fearless-gpus-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fearless-gpus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
